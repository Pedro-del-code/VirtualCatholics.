<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{% block titulo %}Fé & Caminho{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>

<div class="cena">
  <div class="hero">
    <img class="hero-imagem" src="{{ url_for('static', filename='assets/sao-miguel-arcanjo.jpg') }}" alt="São Miguel Arcanjo">
    <div class="hero-veu"></div>
    <div class="topo">
      <p class="brasao">Fé &amp; Caminho</p>
    </div>
  </div>

  <div class="painel-inferior">
    <div class="conteudo">
      <div class="cartao">
        {% block conteudo_cartao %}{% endblock %}
      </div>
    </div>
  </div>
</div>

{% block script %}{% endblock %}

</body>
</html>
