<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{% block titulo %}Fé & Caminho{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

<div class="app-shell">
  <header class="app-cabecalho">
    <p class="marca">Fé &amp; Caminho</p>
  </header>

  <main class="app-conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  <nav class="app-nav">
    <a class="app-nav-item {{ 'ativo' if pagina_atual == 'inicio' else '' }}" href="{{ url_for('tela_inicio') }}">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h5v-6h3v6h5V10"/></svg>
      <span>Início</span>
    </a>
    <a class="app-nav-item {{ 'ativo' if pagina_atual == 'oracoes' else '' }}" href="{{ url_for('tela_oracoes') }}">
      <svg viewBox="0 0 24 24"><path d="M12 2.5v19"/><path d="M6.5 8h11"/></svg>
      <span>Orações</span>
    </a>
    <a class="app-nav-item {{ 'ativo' if pagina_atual == 'leituras' else '' }}" href="{{ url_for('tela_leituras') }}">
      <svg viewBox="0 0 24 24"><path d="M4 5.5c2.8-1.4 5.6-1.4 8 0v14c-2.4-1.4-5.2-1.4-8 0v-14z"/><path d="M20 5.5c-2.8-1.4-5.6-1.4-8 0v14c2.4-1.4 5.2-1.4 8 0v-14z"/></svg>
      <span>Leituras</span>
    </a>
    <a class="app-nav-item {{ 'ativo' if pagina_atual == 'perfil' else '' }}" href="{{ url_for('tela_perfil') }}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.1 3.4-6.5 7.5-6.5s7.5 2.4 7.5 6.5"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>

{% block script %}{% endblock %}

</body>
</html>
